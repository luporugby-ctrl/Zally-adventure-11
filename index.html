<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Zally Golf Club – Prompt Master</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════ BASE ═══════════════════════ */
*{box-sizing:border-box;margin:0;padding:0;image-rendering:pixelated;}
html,body{
  width:100%;height:100%;
  background:#000;
  display:flex;align-items:center;justify-content:center;
  font-family:'Press Start 2P',monospace;
  overflow:hidden;
}

/* ═══════════════════════ WRAPPER ═══════════════════════ */
#game{
  position:relative;
  width:900px;height:580px;
  overflow:hidden;
  border:4px solid #1a2a1a;
  box-shadow:0 0 0 2px #0a0a0a,0 0 40px rgba(0,180,80,0.15);
}

/* canvas di sfondo (campo pixel art) */
#field{position:absolute;top:0;left:0;width:100%;height:100%;}

/* ═══════════════════════ HUD ═══════════════════════ */
#hud{
  position:absolute;top:0;left:0;right:0;
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:8px 12px;z-index:20;pointer-events:none;
}
.hud-block{
  background:rgba(0,0,0,0.82);
  border:2px solid rgba(255,255,255,0.18);
  padding:6px 10px;font-size:7px;
  color:#c8e8c8;line-height:2.1;
}
.hud-block b{color:#fff;}
.hud-block .yellow{color:#f1c40f;}
.hud-block .green{color:#2ecc71;}
.hud-block .red{color:#e74c3c;}

/* shot indicators */
#shotDots{display:flex;gap:5px;margin-top:4px;}
.dot{width:10px;height:10px;border:2px solid #555;background:#111;}
.dot.done{background:#2ecc71;border-color:#2ecc71;}
.dot.active{background:#f1c40f;border-color:#f1c40f;animation:dotPulse .6s infinite alternate;}
@keyframes dotPulse{to{opacity:.4;}}

/* ═══════════════════════ CHALLENGE PANEL ═══════════════════════ */
#panel{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(175deg,#020c1e 0%,#040f28 100%);
  border-top:2px solid #1a3a6a;
  padding:13px 18px 11px;
  z-index:30;
  transform:translateY(0);
  transition:transform .35s cubic-bezier(.4,0,.2,1);
}
#panel.hidden{transform:translateY(102%);}

.panel-header{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap;}
.tech-tag{
  font-size:6px;padding:3px 9px;
  border:1.5px solid currentColor;
  white-space:nowrap;letter-spacing:.5px;
}
.shot-label{font-size:6px;color:#3a5a8a;margin-left:auto;white-space:nowrap;}

.scenario{
  font-size:6.5px;color:#7a9aaa;line-height:2;
  border-left:2px solid #1a4a7a;padding-left:9px;
  margin-bottom:9px;
}
.question{font-size:7.5px;color:#ddeeff;margin-bottom:9px;}

.answers{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}
.ans{
  background:rgba(2,10,30,0.9);
  border:1.5px solid #1a3050;
  color:#90aac0;
  font-family:'Press Start 2P',monospace;
  font-size:5.5px;padding:8px 9px;
  cursor:pointer;text-align:left;line-height:2;
  transition:background .1s,border-color .1s,color .1s;
}
.ans:hover:not([disabled]){background:rgba(15,45,100,.8);border-color:#4af;color:#fff;}
.ans.correct{background:rgba(5,35,15,.9);border-color:#27ae60;color:#27ae60;pointer-events:none;}
.ans.wrong{background:rgba(40,5,5,.9);border-color:#e74c3c;color:#e74c3c;pointer-events:none;}
.ans.dim{pointer-events:none;opacity:.38;}

#fb{
  display:none;font-size:6px;line-height:2;
  color:#90d0a8;border-left:2px solid #27ae60;
  padding-left:9px;margin-bottom:7px;
}
#fb.bad{color:#d09090;border-color:#e74c3c;}

#shootBtn{
  display:none;width:100%;
  background:transparent;border:1.5px solid #27ae60;
  color:#27ae60;font-family:'Press Start 2P',monospace;
  font-size:7.5px;padding:8px;cursor:pointer;
  letter-spacing:1px;
  transition:background .12s,color .12s;
}
#shootBtn:hover{background:#27ae60;color:#000;}

/* ═══════════════════════ POWER ZONE ═══════════════════════ */
#powerZone{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(175deg,#020c1e,#040f28);
  border-top:2px solid #1a3a6a;
  padding:14px 20px 16px;
  display:none;flex-direction:column;
  align-items:center;gap:10px;z-index:35;
}
.pw-label{font-size:6px;color:#f1c40f;animation:blink .7s step-end infinite;}
@keyframes blink{50%{opacity:0;}}

#pwTrack{
  width:480px;height:28px;
  background:#04101e;border:2px solid #1a3050;
  position:relative;overflow:hidden;
}
/* zona sweet spot verde */
#pwTrack::after{
  content:'';position:absolute;top:0;left:36%;width:28%;height:100%;
  background:rgba(39,174,96,.12);
  border-left:1px dashed rgba(39,174,96,.5);
  border-right:1px dashed rgba(39,174,96,.5);
}
#pwFill{
  height:100%;width:0%;
  background:linear-gradient(to right,#27ae60 0%,#f1c40f 55%,#e74c3c 100%);
  transition:width .04s linear;position:relative;z-index:1;
}
.pw-sub{width:480px;display:flex;justify-content:space-between;font-size:5.5px;color:#2a4a6a;margin-top:-6px;}

#swingBtn{
  width:200px;height:36px;
  background:#c0392b;border:2.5px solid #fff;
  color:#fff;font-family:'Press Start 2P',monospace;
  font-size:9px;cursor:pointer;letter-spacing:2px;
  animation:swingPulse .75s infinite alternate;
}
@keyframes swingPulse{to{box-shadow:0 0 22px #e74c3c;}}
#swingBtn:hover{background:#e74c3c;}

/* ═══════════════════════ SHOT BADGE ═══════════════════════ */
#badge{
  position:absolute;left:50%;top:28%;
  transform:translate(-50%,-50%) scale(0);
  font-size:18px;color:#f1c40f;
  text-shadow:3px 3px 0 #000,0 0 20px #f1c40f;
  text-align:center;line-height:1.6;
  z-index:50;pointer-events:none;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
#badge.show{transform:translate(-50%,-50%) scale(1);}

/* ═══════════════════════ HOLE TRANSITION ═══════════════════════ */
#transition{
  position:absolute;inset:0;background:#000;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  z-index:60;opacity:0;pointer-events:none;
  transition:opacity .4s;
}
#transition.show{opacity:1;pointer-events:all;}
.tr1{font-size:7px;color:#2a4a6a;letter-spacing:3px;}
.tr2{font-size:16px;color:#f1c40f;text-shadow:0 0 20px #f1c40f;}
.tr3{font-size:7px;color:#27ae60;}

/* ═══════════════════════ WIN SCREEN ═══════════════════════ */
#win{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 30%,#041428 0%,#000 70%);
  display:none;flex-direction:column;
  align-items:center;justify-content:center;
  z-index:70;gap:14px;
}
#win.show{display:flex;}
.win-trophy{font-size:52px;animation:trophyBounce .7s cubic-bezier(.34,1.56,.64,1);}
@keyframes trophyBounce{from{transform:scale(0) rotate(-20deg);}to{transform:scale(1) rotate(0);}}
.win-title{font-size:13px;color:#f1c40f;text-shadow:0 0 24px #f1c40f;text-align:center;line-height:1.9;}
.win-sub{font-size:6.5px;color:#7aaa8a;text-align:center;line-height:2.3;max-width:540px;}
#restartBtn{
  background:transparent;border:2px solid #f1c40f;
  color:#f1c40f;font-family:'Press Start 2P',monospace;
  font-size:7.5px;padding:11px 26px;cursor:pointer;margin-top:6px;
  transition:background .12s,color .12s;
}
#restartBtn:hover{background:#f1c40f;color:#000;}

/* ═══════════════════════ STAR FX ═══════════════════════ */
@keyframes starFly{
  0%{transform:scale(0) rotate(0deg);opacity:1;}
  100%{transform:scale(1.6) rotate(480deg) translateY(-70px);opacity:0;}
}

/* ═══════════════════════ INTRO SCREEN ═══════════════════════ */
#intro{
  position:absolute;inset:0;z-index:90;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  overflow:hidden;
}
/* Sfondo intro: stesso cielo+erba del campo ma statico */
#introCanvas{position:absolute;inset:0;width:100%;height:100%;}

/* Overlay scuro semitrasparente sopra il canvas */
#intro .overlay{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,
    rgba(0,0,0,0.18) 0%,
    rgba(0,0,0,0.55) 45%,
    rgba(0,0,0,0.82) 100%);
}

#intro .content{
  position:relative;z-index:2;
  display:flex;flex-direction:column;
  align-items:center;gap:0;
  width:100%;
}

/* Titolo arcade animato */
.intro-pretitle{
  font-size:7px;color:#4af;letter-spacing:4px;
  margin-bottom:10px;
  animation:fadeSlideDown .6s ease both;
}
.intro-logo{
  font-size:28px;color:#f1c40f;
  text-shadow:4px 4px 0 #a07000, 0 0 30px rgba(241,196,15,0.6);
  line-height:1.2;text-align:center;
  animation:fadeSlideDown .6s .1s ease both;
  margin-bottom:4px;
}
.intro-sub{
  font-size:9px;color:#fff;letter-spacing:2px;
  text-shadow:2px 2px 0 #000;
  animation:fadeSlideDown .6s .2s ease both;
  margin-bottom:22px;
}

@keyframes fadeSlideDown{
  from{opacity:0;transform:translateY(-18px);}
  to{opacity:1;transform:translateY(0);}
}

/* Scheda quest */
.intro-card{
  background:rgba(2,8,24,0.88);
  border:2px solid rgba(74,175,255,0.4);
  border-top:2px solid #4af;
  width:680px;
  padding:16px 22px 14px;
  margin-bottom:20px;
  animation:fadeSlideUp .6s .35s ease both;
}
@keyframes fadeSlideUp{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

.intro-card-title{
  font-size:7px;color:#4af;letter-spacing:2px;
  margin-bottom:12px;border-bottom:1px solid rgba(74,175,255,0.2);
  padding-bottom:8px;
}

.intro-shots{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
  margin-bottom:12px;
}
.intro-shot{
  display:flex;align-items:flex-start;gap:8px;
  background:rgba(255,255,255,0.03);
  border:1px solid rgba(255,255,255,0.07);
  padding:8px 10px;
}
.intro-shot-num{
  font-size:16px;line-height:1;flex-shrink:0;margin-top:1px;
}
.intro-shot-body{}
.intro-shot-tech{font-size:6px;margin-bottom:3px;}
.intro-shot-desc{font-size:5.5px;color:#6a8aaa;line-height:1.9;}

.intro-par{
  display:flex;justify-content:space-between;align-items:center;
  border-top:1px solid rgba(255,255,255,0.07);
  padding-top:10px;font-size:6px;
}
.intro-par-left{color:#567;line-height:2;}
.intro-par-left span{color:#aaa;}
.intro-par-badge{
  background:rgba(39,174,96,0.15);
  border:1px solid #27ae60;
  color:#27ae60;padding:4px 12px;font-size:6px;
}

/* INSERT COIN button */
.intro-start{
  background:transparent;
  border:2px solid #f1c40f;
  color:#f1c40f;
  font-family:'Press Start 2P',monospace;
  font-size:9px;padding:12px 36px;
  cursor:pointer;letter-spacing:2px;
  animation:fadeSlideUp .5s .5s ease both, coinBlink 1s .5s step-end infinite;
  transition:background .15s,color .15s;
}
@keyframes coinBlink{
  0%,100%{opacity:1;}50%{opacity:0.3;}
}
.intro-start:hover{
  background:#f1c40f;color:#000;
  animation:fadeSlideUp .5s .5s ease both; /* stop blink on hover */
}

/* Zalando credit */
.intro-credit{
  position:absolute;bottom:10px;left:0;right:0;
  text-align:center;font-size:5.5px;color:#2a4a3a;
  animation:fadeSlideUp .5s .7s ease both;
  z-index:2;
}

</head>
<body>
<div id="game">
  <canvas id="field" width="900" height="580"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="hud-block">
      <b>ZALLY GOLF CLUB</b><br>
      HOLE 1 &nbsp;·&nbsp; PAR 4<br>
      <div id="shotDots">
        <div class="dot active" id="d0"></div>
        <div class="dot" id="d1"></div>
        <div class="dot" id="d2"></div>
        <div class="dot" id="d3"></div>
      </div>
    </div>
    <div class="hud-block" style="text-align:center;">
      SHOT <span class="yellow" id="hudShot">1</span>/4<br>
      <span id="hudTech" style="color:#4af;font-size:6px;">ROLE-PLAYING</span>
    </div>
    <div class="hud-block" style="text-align:right;">
      WIND&nbsp;<span class="yellow" id="hudWind">5m/s →</span><br>
      SCORE&nbsp;<span class="green" id="hudScore">EVEN</span>
    </div>
  </div>

  <!-- CHALLENGE PANEL -->
  <div id="panel">
    <div class="panel-header">
      <span class="tech-tag" id="techTag">🎭 ROLE-PLAYING</span>
      <span class="shot-label" id="shotLabel">SHOT 1 / 4</span>
    </div>
    <div class="scenario" id="scenarioTxt"></div>
    <div class="question" id="questionTxt"></div>
    <div class="answers" id="answersGrid"></div>
    <div id="fb"></div>
    <button id="shootBtn" onclick="goToPower()">COLPISCI! ⛳</button>
  </div>

  <!-- POWER ZONE -->
  <div id="powerZone">
    <div class="pw-label">▶ SPAZIO o SWING per fermare la potenza!</div>
    <div id="pwTrack"><div id="pwFill"></div></div>
    <div class="pw-sub"><span>CORTO</span><span>◀ ZONA IDEALE ▶</span><span>LUNGO</span></div>
    <button id="swingBtn" onclick="stopPower()">⛳ SWING!</button>
  </div>

  <!-- BADGE -->
  <div id="badge"></div>

  <!-- TRANSITION -->
  <div id="transition">
    <div class="tr1">PROSSIMO COLPO</div>
    <div class="tr2" id="trTech"></div>
    <div class="tr3" id="trSub"></div>
  </div>

  <!-- WIN -->
  <div id="win">
    <div class="win-trophy">🏆</div>
    <div class="win-title">HOLE COMPLETE!<br>PROMPT MASTER!</div>
    <div class="win-sub" id="winSub"></div>
    <button id="restartBtn" onclick="restartGame()">PLAY AGAIN ⛳</button>
  </div>
</div>

<script>
/* ═══════════════════ DATA ═══════════════════ */
const SHOTS = [
  {
    tech:"ROLE-PLAYING", icon:"🎭", color:"#e74c3c",
    wind:"5 m/s →", windDx:1,
    scenario:"Il CEO vuole un'analisi critica del Q3. Hai bisogno che Gemini si comporti da consulente senior severo, non da assistente che annuisce a tutto.",
    question:"Quale prompt usa correttamente il ROLE-PLAYING?",
    answers:[
      {t:"Analizza i risultati del Q3 e dimmi cosa pensi.", ok:false,
       w:"Nessun ruolo: Gemini risponderà in modo generico e accomodante."},
      {t:"Agisci come un CFO con 20 anni di esperienza. Analizza il Q3: identifica le 3 maggiori inefficienze e proponi azioni correttive senza sconti.", ok:true,
       w:"Ruolo preciso + stile + compito = risposta calibrata come un vero esperto."},
      {t:"Sei un assistente. Guarda il Q3 e fai un riassunto.", ok:false,
       w:"'Assistente' non è un ruolo specifico. Mancano stile e vincoli comportamentali."},
      {t:"Dammi un'analisi professionale e dettagliata del Q3.", ok:false,
       w:"'Professionale' è vago. Nessuna persona con cui Gemini possa identificarsi."}
    ],
    feedback:"Il ROLE-PLAYING imposta le System Instructions: definendo persona, stile e vincoli, ogni risposta sarà coerente come avere un esperto dedicato nel team.",
    emailTakeaway:"Stop talking to a generic chatbot. Assign Gemini a precise role — job title, experience, behavioral rules. <b>A CFO with 20 years and zero tolerance for excuses</b> will give you a completely different (and far more useful) response than 'professional assistant'. The persona IS the prompt."
  },
  {
    tech:"CONTEXT-AWARE", icon:"🌍", color:"#3498db",
    wind:"12 m/s ↗", windDx:0.7,
    scenario:"Black Friday tra 48h. 12 corrieri bloccati, 3 hub offline. Hai bisogno di ottimizzare i turni — senza contesto, Gemini darà soluzioni da manuale, non da emergenza.",
    question:"Quale prompt fornisce il CONTESTO operativo corretto?",
    answers:[
      {t:"Come ottimizzare i turni di magazzino durante il Black Friday?", ok:false,
       w:"Domanda generica senza contesto: ottieni consigli standard da Google."},
      {t:"Ottimizza i turni. Abbiamo poco personale e molto lavoro.", ok:false,
       w:"'Poco personale, molto lavoro' è troppo vago per calibrare la risposta."},
      {t:"Siamo a 48h dal Black Friday. 12 corrieri assenti, hub Milano e Roma offline. 340 ordini prioritari. Con questi vincoli, come minimizzare i ritardi ottimizzando i turni?", ok:true,
       w:"Contesto temporale + vincoli reali + numeri precisi = risposta sull'emergenza, non sul manuale."},
      {t:"È un periodo di picco. Cosa faccio con i turni?", ok:false,
       w:"'Periodo di picco' non dice nulla sui vincoli specifici del problema."}
    ],
    feedback:"Il CONTEXT-AWARE Prompting trasforma domande generiche in richieste su misura. Gemini non è telepatico: i dettagli del tuo contesto sono il suo brief di progetto.",
    emailTakeaway:"Gemini isn't a mind reader — it's a mirror. <b>The quality of the output reflects the richness of your input.</b> Operational context (timing, constraints, real numbers) is the difference between a textbook answer and a field-ready solution. Before you ask the question, brief Gemini like you'd brief a new team member on their first emergency shift."
  },
  {
    tech:"NEGATIVE PROMPTING", icon:"🚫", color:"#e67e22",
    wind:"8 m/s ↙", windDx:-0.5,
    scenario:"Serve un report magazzino leggibile da un manager non tecnico. Gemini di default usa gergo, acronimi e fa output interminabili — devi fermare quei comportamenti.",
    question:"Quale prompt usa meglio il NEGATIVE PROMPTING?",
    answers:[
      {t:"Scrivi un report di magazzino semplice e chiaro, senza cose complicate.", ok:false,
       w:"'Senza cose complicate' è soggettivo. Gemini non sa cosa intendi."},
      {t:"Fai un report magazzino. Tienilo breve.", ok:false,
       w:"'Breve' è vago: quanto breve? Gemini interpreterà a modo suo."},
      {t:"Scrivi un report sullo stato del magazzino. NON usare acronimi. NON includere dati grezzi. NON superare 5 punti. Ogni punto max 2 righe.", ok:true,
       w:"Tre divieti espliciti + limite quantitativo = output pulito e prevedibile ogni volta."},
      {t:"Scrivi un report professionale e conciso per il management.", ok:false,
       w:"'Professionale e conciso' sono qualitative: ogni AI le interpreta diversamente."}
    ],
    feedback:"Il NEGATIVE PROMPTING è chirurgico: 'NON fare X' è spesso più potente di 'fai Y'. Definisce i confini dell'output e disattiva i comportamenti di default inutili.",
    emailTakeaway:"Sometimes the most powerful word in a prompt is <b>NOT</b>. Gemini has default behaviors baked in — verbose explanations, technical jargon, bullet overload. Explicit prohibitions override those defaults surgically. Think of it as setting the out-of-bounds markers on your fairway: <b>no acronyms, no raw data, max 5 points</b> — now Gemini knows exactly where NOT to go."
  },
  {
    tech:"META-PROMPTING", icon:"🧠", color:"#9b59b6",
    wind:"3 m/s ↓", windDx:0,
    scenario:"Devi automatizzare un processo di cross-docking complesso ma non sai da dove iniziare. Non conosci nemmeno le domande giuste da fare.",
    question:"Qual è la mossa da Meta-Prompting master?",
    answers:[
      {t:"Spiegami il cross-docking e come automatizzarlo.", ok:false,
       w:"Risposta educativa, non operativa. Ottieni teoria generica."},
      {t:"Prima di rispondermi, fammi 5 domande per capire il mio processo, poi costruisci il prompt ideale per aiutarmi ad automatizzarlo.", ok:true,
       w:"Usi Gemini come Prompt Engineer: ti fa le domande giuste prima di rispondere."},
      {t:"Come posso migliorare il mio processo logistico?", ok:false,
       w:"Troppo generico. Best practice universali, non la tua soluzione."},
      {t:"Dammi 10 consigli per il cross-docking.", ok:false,
       w:"Lista standard. Nessun adattamento al tuo contesto specifico."}
    ],
    feedback:"Il META-PROMPTING trasforma Gemini nel tuo Prompt Engineer personale. Invece di cercare la domanda perfetta, chiedi a Gemini di trovarla per te.",
    emailTakeaway:"The highest level of prompting isn't about asking the perfect question — it's about <b>asking Gemini to find the perfect question for you.</b> When you're stuck at the tee box of a complex problem, Meta-Prompting is the caddie that hands you the right club. Ask it to interview you, build the prompt, then answer it. That's a hole-in-one workflow."
  }
];

/* ═══════════════════ STATE ═══════════════════ */
let shotIdx = 0;
let totalScore = 0;
let shotResults = [];
let answered = false;
let correctChosen = false;
let phase = "challenge";

let power = 0, pwDir = 1, pwRunning = false, pwRaf = null;

let bx = 0, by = 0, bvx = 0, bvy = 0;
let ballActive = false;
let trail = [];

let zallyState = "idle"; // idle | backswing | swing | follow
let zallySwingT = 0;

let cloudX = [60, 220, 400, 620, 800];
let frameN = 0;

/* ═══════════════════ CANVAS SETUP ═══════════════════ */
const canvas = document.getElementById('field');
const ctx = canvas.getContext('2d');
const W = 900, H = 580;

/* ═══════════════════ INIT ═══════════════════ */
function init() {
  loadShot(0);
  requestAnimationFrame(loop);
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); stopPower(); }
  });
}

/* ═══════════════════ LOAD SHOT ═══════════════════ */
function loadShot(idx) {
  shotIdx = idx;
  answered = false;
  correctChosen = false;
  ballActive = false;
  trail = [];
  zallyState = "idle";
  phase = "challenge";

  const s = SHOTS[idx];

  // HUD
  document.getElementById('hudShot').textContent = idx + 1;
  document.getElementById('hudTech').textContent = s.tech;
  document.getElementById('hudWind').textContent = s.wind;
  updateScoreHUD();

  // Shot dots
  for (let i = 0; i < 4; i++) {
    const d = document.getElementById('d' + i);
    d.className = 'dot' + (i < idx ? ' done' : i === idx ? ' active' : '');
  }

  // Panel
  document.getElementById('techTag').textContent = s.icon + ' ' + s.tech;
  document.getElementById('techTag').style.color = s.color;
  document.getElementById('techTag').style.borderColor = s.color;
  document.getElementById('shotLabel').textContent = `SHOT ${idx + 1} / 4`;
  document.getElementById('scenarioTxt').textContent = s.scenario;
  document.getElementById('questionTxt').textContent = s.question;

  // Shuffle & render answers
  const grid = document.getElementById('answersGrid');
  grid.innerHTML = '';
  [...s.answers].sort(() => Math.random() - .5).forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'ans';
    btn.textContent = a.t;
    btn.onclick = () => selectAnswer(a);
    grid.appendChild(btn);
  });

  document.getElementById('fb').style.display = 'none';
  document.getElementById('shootBtn').style.display = 'none';
  document.getElementById('panel').classList.remove('hidden');
  document.getElementById('powerZone').style.display = 'none';
  document.getElementById('badge').className = 'badge';
  document.getElementById('transition').classList.remove('show');
}

/* ═══════════════════ ANSWER ═══════════════════ */
function selectAnswer(chosen) {
  if (answered) return;
  answered = true;
  correctChosen = chosen.ok;

  document.querySelectorAll('.ans').forEach(btn => {
    const match = SHOTS[shotIdx].answers.find(a => a.t === btn.textContent);
    if (!match) return;
    if (match.ok) btn.classList.add('correct');
    else if (match === chosen) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });

  const fb = document.getElementById('fb');
  fb.className = correctChosen ? '' : 'bad';
  fb.style.display = 'block';
  fb.textContent = (correctChosen ? '✅ CORRETTO! ' : '❌ SBAGLIATO! ') + chosen.w;

  document.getElementById('shootBtn').style.display = 'block';
  document.getElementById('shootBtn').textContent = correctChosen
    ? '⛳ PERFETTO — COLPISCI!'
    : '→ VAI AL TEE COMUNQUE';
}

/* ═══════════════════ POWER ═══════════════════ */
function goToPower() {
  document.getElementById('panel').classList.add('hidden');
  document.getElementById('powerZone').style.display = 'flex';
  phase = 'power';
  power = 0; pwDir = 1; pwRunning = true;
  runPower();
}

function runPower() {
  if (!pwRunning) return;
  power += pwDir * 1.9;
  if (power >= 100) { power = 100; pwDir = -1; }
  if (power <= 0) { power = 0; pwDir = 1; }
  document.getElementById('pwFill').style.width = power + '%';
  pwRaf = requestAnimationFrame(runPower);
}

function stopPower() {
  if (phase !== 'power') return;
  pwRunning = false;
  cancelAnimationFrame(pwRaf);
  document.getElementById('powerZone').style.display = 'none';
  phase = 'flight';
  launchBall(power);
  doZallySwing();
  playSwing();
}

/* ═══════════════════ BALL ═══════════════════ */
function launchBall(pw) {
  ballActive = true;
  trail = [];
  const s = SHOTS[shotIdx];
  // Zally è centrata in basso → palla parte da lì
  bx = W * 0.5 + 18;
  by = H * 0.73;
  const windX = s.windDx * s.wind.match(/\d+/)[0] * 0.009;
  const spd = 3.8 + (pw / 100) * 7.2;
  const angle = (52 - pw * 0.14) * Math.PI / 180;
  bvx = Math.cos(angle) * spd * 0.9 + windX;
  bvy = -Math.sin(angle) * spd;
}

function updateBall() {
  bvy += 0.175;
  bx += bvx; by += bvy;
  trail.push({ x: bx, y: by });
  if (trail.length > 32) trail.shift();
  // ground in prospettiva: vicino=basso, lontano=alto
  const ground = perspGround(bx);
  if (by >= ground) {
    by = ground; ballActive = false;
    phase = 'result';
    playLand();
    setTimeout(showResult, 600);
  }
  if (bx > W + 100 || bx < -100) { phase = 'result'; setTimeout(showResult, 200); }
}

function perspGround(x) {
  const t = Math.max(0, Math.min(1, (x - W * .15) / (W * .7)));
  return H * 0.78 - t * (H * 0.31);
}

/* ═══════════════════ RESULT ═══════════════════ */
function showResult() {
  // target = flag, schematicamente al centro del green
  const flagSX = W * 0.5;
  const dist = Math.abs(bx - flagSX);
  const pw = power;
  let label, delta;
  if (!correctChosen) { label = "BOGEY +1 💨"; delta = 1; }
  else if (dist < W * 0.05) { label = "HOLE IN ONE! ⭐⭐"; delta = -2; }
  else if (dist < W * 0.12) { label = "EAGLE 🦅 -1"; delta = -1; }
  else if (dist < W * 0.22) { label = "BIRDIE 🐦 ±0"; delta = 0; }
  else { label = "PAR ⛳ ±0"; delta = 0; }

  totalScore += delta;
  shotResults.push({ shot: shotIdx + 1, tech: SHOTS[shotIdx].tech, label, delta });
  updateScoreHUD();

  const badge = document.getElementById('badge');
  badge.textContent = label; badge.className = 'show';
  playResult(delta);
  spawnStars(delta < 0 ? 5 : 2);

  setTimeout(() => {
    badge.className = '';
    if (shotIdx >= SHOTS.length - 1) {
      finalHole();
    } else {
      showTransition();
    }
  }, 2400);
}

function showTransition() {
  const next = SHOTS[shotIdx + 1];
  document.getElementById('trTech').textContent = next.icon + ' ' + next.tech;
  document.getElementById('trTech').style.color = next.color;
  document.getElementById('trSub').textContent = `SHOT ${shotIdx + 2} / 4`;
  document.getElementById('transition').classList.add('show');
  setTimeout(() => {
    document.getElementById('transition').classList.remove('show');
    loadShot(shotIdx + 1);
  }, 2200);
}

function finalHole() {
  // Animazione: la palla rotola verso la buca
  ballActive = true;
  bx = W * 0.5; by = perspGround(W * 0.5);
  bvx = (W * 0.5 - bx) * 0.05;
  bvy = 0;
  setTimeout(() => {
    ballActive = false;
    playHoleIn();
    spawnStars(8);
    setTimeout(showWin, 1200);
  }, 800);
}

/* ═══════════════════ WIN ═══════════════════ */
function showWin() {
  const sc = totalScore === 0 ? 'EVEN'
    : totalScore < 0 ? `-${Math.abs(totalScore)}`
    : `+${totalScore}`;
  const lines = shotResults.map(r =>
    `SHOT ${r.shot} (${r.tech}): ${r.label}`
  ).join('\n');
  document.getElementById('winSub').textContent =
    `Score: ${sc}\n\n${lines}\n\nHai padroneggiato 4 tecniche di Prompt Engineering.\nApplicale su Gemini Workspace!`;
  document.getElementById('win').classList.add('show');
  playVictory();

  // ── EMAIL (solo in Apps Script — ignorata su GitHub) ──
  if (typeof sendCompletionEmail === 'function') sendCompletionEmail();
}

function restartGame() {
  totalScore = 0; shotResults = [];
  document.getElementById('win').classList.remove('show');
  loadShot(0);
}

function updateScoreHUD() {
  const el = document.getElementById('hudScore');
  if (totalScore === 0) { el.textContent = 'EVEN'; el.style.color = '#2ecc71'; }
  else if (totalScore < 0) { el.textContent = `-${Math.abs(totalScore)}`; el.style.color = '#f1c40f'; }
  else { el.textContent = `+${totalScore}`; el.style.color = '#e74c3c'; }
}

/* ═══════════════════ ZALLY SWING ═══════════════════ */
function doZallySwing() {
  zallyState = 'backswing';
  setTimeout(() => zallyState = 'swing', 140);
  setTimeout(() => zallyState = 'follow', 320);
  setTimeout(() => zallyState = 'idle', 900);
}

/* ═══════════════════ MAIN LOOP ═══════════════════ */
function loop() {
  frameN++;
  // move clouds
  cloudX = cloudX.map(x => (x + 0.28) % (W + 160));
  drawScene();
  if (phase === 'flight' && ballActive) updateBall();
  requestAnimationFrame(loop);
}

/* ═══════════════════════════════════════════════════════
   DRAW SCENE — stile NES Golf pixel art
═══════════════════════════════════════════════════════ */
function drawScene() {
  const s = SHOTS[shotIdx];
  ctx.clearRect(0, 0, W, H);

  drawSky();
  drawSun();
  drawMountains();
  drawClouds();
  drawForestLeft();
  drawForestRight();
  drawFairway();
  drawLake();
  drawBunkers();
  drawGreenAndHole(s);
  drawTeeBox();
  drawBallTrail();
  if (ballActive || phase === 'result') drawBall();
  drawZally(s);
  drawVignette();
}

/* ── SKY ── */
function drawSky() {
  // Cielo sfumato stile NES: bande orizzontali di colore
  const bands = [
    [0,    H*0.14, '#5ba8d8'],
    [H*0.14, H*0.22, '#6cb4e0'],
    [H*0.22, H*0.36, '#7dc0e8'],
    [H*0.36, H*0.50, '#92ccee'],
  ];
  bands.forEach(([y0,y1,c]) => {
    ctx.fillStyle = c;
    ctx.fillRect(0, y0, W, y1 - y0);
  });
}

/* ── SOLE ── */
function drawSun() {
  const sx = W*0.84, sy = H*0.10;
  ctx.fillStyle = '#fff9a0';
  // pixel art sun: blocchi 4×4
  const blocks = [
    [0,0],[1,0],[2,0],
    [0,1],[1,1],[2,1],
    [0,2],[1,2],[2,2],
  ];
  const bs = 7;
  blocks.forEach(([bx_,by_]) => {
    ctx.fillRect(sx + bx_*bs - bs, sy + by_*bs - bs, bs-1, bs-1);
  });
  // raggi pixel
  ctx.fillStyle = '#fff060';
  [[sx+22,sy+4],[sx+24,sy+12],[sx+4,sy+22],[sx-6,sy+18],[sx-10,sy+5]].forEach(([rx,ry]) => {
    ctx.fillRect(rx, ry, 4, 4);
  });
}

/* ── MONTAGNE SFONDO ── */
function drawMountains() {
  const horizon = H * 0.48;
  // montagne lontane (blu/viola, stile NES)
  const mts = [
    {x:50, h:70, c:'#6a7aaa'},
    {x:160, h:90, c:'#5a6a9a'},
    {x:300, h:60, c:'#6a7aaa'},
    {x:420, h:80, c:'#5a6a9a'},
    {x:580, h:55, c:'#7080b0'},
    {x:700, h:75, c:'#6070a0'},
    {x:820, h:65, c:'#5a6a9a'},
  ];
  mts.forEach(m => {
    ctx.fillStyle = m.c;
    ctx.beginPath();
    ctx.moveTo(m.x, horizon);
    ctx.lineTo(m.x + 60, horizon - m.h);
    ctx.lineTo(m.x + 120, horizon);
    ctx.closePath(); ctx.fill();
    // cima innevata
    ctx.fillStyle = '#c8d8f0';
    ctx.beginPath();
    ctx.moveTo(m.x + 48, horizon - m.h * 0.55);
    ctx.lineTo(m.x + 60, horizon - m.h);
    ctx.lineTo(m.x + 72, horizon - m.h * 0.55);
    ctx.closePath(); ctx.fill();
  });
}

/* ── NUVOLE pixel art ── */
function drawClouds() {
  cloudX.forEach((cx, i) => {
    const cy = [H*0.12, H*0.18, H*0.09, H*0.20, H*0.14][i];
    const scale = [1.2, 0.9, 1.0, 1.3, 0.8][i];
    pixelCloud(cx - 80, cy, scale);
  });
}

function pixelCloud(x, y, sc) {
  const S = Math.round(sc * 8);
  const blocks = [
    [1,1],[2,1],[3,1],[4,1],
    [0,2],[1,2],[2,2],[3,2],[4,2],[5,2],
    [0,3],[1,3],[2,3],[3,3],[4,3],[5,3],
    [1,4],[2,4],[3,4],
  ];
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  blocks.forEach(([bx_,by_]) => {
    ctx.fillRect(x + bx_*S, y + by_*S, S-1, S-1);
  });
}

/* ── FORESTA SINISTRA (densa, stile NES) ── */
function drawForestLeft() {
  const horizon = H * 0.48;
  const groundBase = H * 0.72;

  // striscia rough sinistra
  ctx.fillStyle = '#1a5c1a';
  ctx.beginPath();
  ctx.moveTo(0, horizon);
  ctx.lineTo(W*0.22, horizon);
  ctx.lineTo(W*0.08, groundBase);
  ctx.lineTo(0, groundBase);
  ctx.closePath(); ctx.fill();

  // alberi pixel art — da lontano (piccoli) a vicino (grandi)
  const trees = [
    // [x, groundY, size, darkVariant]
    {x:20,  y:horizon+2,  s:18, v:0},
    {x:55,  y:horizon+5,  s:22, v:1},
    {x:95,  y:horizon+8,  s:26, v:0},
    {x:38,  y:horizon+14, s:28, v:1},
    {x:130, y:horizon+18, s:20, v:0},
    {x:12,  y:horizon+30, s:32, v:1},
    {x:68,  y:horizon+28, s:36, v:0},
    {x:110, y:horizon+35, s:30, v:1},
    {x:30,  y:horizon+50, s:42, v:0},
    {x:75,  y:horizon+52, s:44, v:1},
    {x:125, y:horizon+55, s:40, v:0},
    {x:8,   y:horizon+75, s:52, v:1},
    {x:60,  y:horizon+78, s:56, v:0},
    {x:115, y:horizon+80, s:50, v:1},
  ];
  trees.forEach(t => pixelTree(t.x, t.y, t.s, t.v));
}

/* ── FORESTA DESTRA ── */
function drawForestRight() {
  const horizon = H * 0.48;
  const groundBase = H * 0.72;

  ctx.fillStyle = '#1a5c1a';
  ctx.beginPath();
  ctx.moveTo(W, horizon);
  ctx.lineTo(W*0.78, horizon);
  ctx.lineTo(W*0.92, groundBase);
  ctx.lineTo(W, groundBase);
  ctx.closePath(); ctx.fill();

  const trees = [
    {x:W-30,  y:horizon+2,  s:16, v:1},
    {x:W-65,  y:horizon+6,  s:20, v:0},
    {x:W-105, y:horizon+10, s:24, v:1},
    {x:W-45,  y:horizon+20, s:28, v:0},
    {x:W-140, y:horizon+22, s:22, v:1},
    {x:W-20,  y:horizon+35, s:34, v:0},
    {x:W-80,  y:horizon+32, s:38, v:1},
    {x:W-125, y:horizon+38, s:30, v:0},
    {x:W-35,  y:horizon+55, s:44, v:1},
    {x:W-90,  y:horizon+58, s:46, v:0},
    {x:W-140, y:horizon+60, s:42, v:1},
    {x:W-18,  y:horizon+80, s:54, v:0},
    {x:W-75,  y:horizon+82, s:58, v:1},
  ];
  trees.forEach(t => pixelTree(t.x, t.y, t.s, t.v));
}

function pixelTree(x, y, s, variant) {
  const trunkW = Math.max(3, s * 0.2);
  const trunkH = s * 0.35;
  // trunk
  ctx.fillStyle = '#5a3a10';
  ctx.fillRect(x - trunkW/2, y, trunkW, trunkH);
  // fogliame a 3 livelli (triangoli pixel)
  const greens = variant ? ['#1a6e1a','#228b22','#2aaa2a'] : ['#155015','#1a6a1a','#22882a'];
  [0,1,2].forEach(lvl => {
    const w = s * (1 - lvl*0.22);
    const h = s * (0.45 + lvl*0.08);
    const ty = y - h * (1.1 + lvl*0.6);
    ctx.fillStyle = greens[lvl];
    ctx.beginPath();
    ctx.moveTo(x - w/2, ty + h);
    ctx.lineTo(x, ty);
    ctx.lineTo(x + w/2, ty + h);
    ctx.closePath(); ctx.fill();
    // highlight (1 pixel più chiaro)
    ctx.fillStyle = greens[2];
    ctx.beginPath();
    ctx.moveTo(x - w*0.1, ty + h*0.3);
    ctx.lineTo(x, ty);
    ctx.lineTo(x + w*0.1, ty + h*0.3);
    ctx.closePath(); ctx.fill();
  });
}

/* ── FAIRWAY ── */
function drawFairway() {
  const horizon = H * 0.48;

  // Erba da fairway principale (prospettiva NES: strisce orizzontali)
  // ogni striscia è più larga man mano che scende
  const nStripes = 16;
  const c1 = '#27ae60', c2 = '#2ecc71';
  for (let i = 0; i < nStripes; i++) {
    const t0 = i / nStripes, t1 = (i+1) / nStripes;
    const y0 = horizon + (H - horizon) * t0;
    const y1 = horizon + (H - horizon) * t1;
    // larghezza del corridoio fairway si allarga verso il basso
    const fw = 0.56 + t0 * 0.44; // da 56% a 100% della larghezza
    const lx = W * (0.5 - fw/2);
    const rx = W * (0.5 + fw/2);
    ctx.fillStyle = i % 2 === 0 ? c1 : c2;
    ctx.fillRect(lx, y0, rx - lx, y1 - y0);
  }

  // Linee di marcatura del fairway (bianche, pixel art)
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  // linea centrale tratteggiata
  ctx.setLineDash([8, 8]);
  ctx.beginPath();
  ctx.moveTo(W*0.5, horizon); ctx.lineTo(W*0.5, H);
  ctx.stroke();
  ctx.setLineDash([]);
}

/* ── LAGO (destra, in prospettiva) ── */
function drawLake() {
  const lakeX = W * 0.62, lakeY = H * 0.56;

  // Ombra lago
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(lakeX + 4, lakeY + 4, 85, 26, -0.08, 0, Math.PI*2); ctx.fill();

  // Lago principale
  const lakeGrad = ctx.createRadialGradient(lakeX-20, lakeY-8, 5, lakeX, lakeY, 88);
  lakeGrad.addColorStop(0, '#4ab4e0');
  lakeGrad.addColorStop(0.5, '#2a8ac0');
  lakeGrad.addColorStop(1, '#1a6898');
  ctx.fillStyle = lakeGrad;
  ctx.beginPath();
  ctx.ellipse(lakeX, lakeY, 84, 25, -0.08, 0, Math.PI*2); ctx.fill();

  // Bordo lago (pixel art: linea scura)
  ctx.strokeStyle = '#1a5a7a'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(lakeX, lakeY, 84, 25, -0.08, 0, Math.PI*2); ctx.stroke();

  // Riflesso sole (shimmer)
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  // Piccoli blocchi pixel animati
  const shimmerT = Math.sin(frameN * 0.08) * 0.5 + 0.5;
  [[lakeX-20, lakeY-6],[lakeX+10, lakeY-2],[lakeX-5, lakeY+6],[lakeX+30, lakeY-8]].forEach(([rx,ry], i) => {
    const a = Math.sin(frameN*0.1 + i*1.3) * 0.5 + 0.5;
    ctx.globalAlpha = a * 0.7;
    ctx.fillRect(rx, ry, 6, 3);
  });
  ctx.globalAlpha = 1;

  // Piccole onde pixel
  ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1.5;
  ctx.setLineDash([4,5]);
  [[-30,-4],[0,-1],[25,5],[-15,8]].forEach(([ox,oy]) => {
    ctx.beginPath();
    ctx.arc(lakeX + ox, lakeY + oy, 10, 0.2, Math.PI-0.2); ctx.stroke();
  });
  ctx.setLineDash([]);

  // Testo "LAKE"
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.font = '6px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('LAKE', lakeX, lakeY + 4);
  ctx.textAlign = 'left';
}

/* ── COLLINETTE (bunkers + hills) ── */
function drawBunkers() {
  // Collinetta sinistra
  const hg1 = ctx.createRadialGradient(W*0.28, H*0.62, 5, W*0.28, H*0.64, 52);
  hg1.addColorStop(0, '#3ec870'); hg1.addColorStop(1, '#27ae60');
  ctx.fillStyle = hg1;
  ctx.beginPath(); ctx.ellipse(W*0.28, H*0.64, 52, 18, 0.1, 0, Math.PI*2); ctx.fill();

  // Bunker sabbia SX
  ctx.fillStyle = '#d4b06a';
  ctx.beginPath(); ctx.ellipse(W*0.27, H*0.635, 30, 9, 0.05, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#e0c07a';
  ctx.beginPath(); ctx.ellipse(W*0.265, H*0.63, 18, 5, 0, 0, Math.PI*2); ctx.fill();
  // granelli sabbia (pixel)
  ctx.fillStyle = '#c8a050';
  for(let i=0;i<8;i++){
    ctx.fillRect(W*0.24+i*7, H*0.632+Math.sin(i)*3, 3, 2);
  }

  // Collinetta centrale destra
  const hg2 = ctx.createRadialGradient(W*0.6, H*0.60, 3, W*0.6, H*0.615, 38);
  hg2.addColorStop(0, '#3ec870'); hg2.addColorStop(1, '#27ae60');
  ctx.fillStyle = hg2;
  ctx.beginPath(); ctx.ellipse(W*0.60, H*0.615, 38, 14, -0.1, 0, Math.PI*2); ctx.fill();

  // Bunker sabbia DX (davanti al green)
  ctx.fillStyle = '#d4b06a';
  ctx.beginPath(); ctx.ellipse(W*0.43, H*0.60, 26, 8, 0.08, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#e0c07a';
  ctx.beginPath(); ctx.ellipse(W*0.428, H*0.598, 15, 5, 0, 0, Math.PI*2); ctx.fill();
}

/* ── GREEN + BUCA ── */
function drawGreenAndHole(s) {
  const gx = W*0.5, gy = H*0.538;

  // Ombra green
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(gx+5, gy+7, 68, 19, 0, 0, Math.PI*2); ctx.fill();

  // Green
  const gg = ctx.createRadialGradient(gx-15, gy-8, 4, gx, gy, 65);
  gg.addColorStop(0, '#44e878'); gg.addColorStop(0.6, '#2ecc68'); gg.addColorStop(1, '#1aaa50');
  ctx.fillStyle = gg;
  ctx.beginPath(); ctx.ellipse(gx, gy, 66, 19, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#18883c'; ctx.lineWidth = 2;

function drawTeeBox() {

/* ── TRAIL ── */
function drawBallTrail() {
  trail.forEach((p, i) => {
    const a = (i / trail.length) * 0.5;
    const r = 1.5 + (i / trail.length) * 2.5;
    ctx.fillStyle = `rgba(255,240,80,${a})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI*2); ctx.fill();
  });
}

/* ── PALLA ── */
function drawBall() {
  if (!bx) return;
  const distT = Math.max(0.2, 1 - (by - H*0.50) / (H*0.35) * 0.8);
  const r = Math.max(2, 6 * distT);
  // ombra sotto
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.ellipse(bx, perspGround(bx)+2, r*1.5, r*0.5, 0, 0, Math.PI*2); ctx.fill();
  // palla
  const bg = ctx.createRadialGradient(bx-r*.25, by-r*.3, r*.1, bx, by, r);
  bg.addColorStop(0,'#fff'); bg.addColorStop(.5,'#eee'); bg.addColorStop(1,'#aaa');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(bx, by, r, 0, Math.PI*2); ctx.fill();
  // highlight
  ctx.fillStyle='rgba(255,255,255,.75)';
  ctx.beginPath(); ctx.arc(bx-r*.28, by-r*.3, r*.3, 0, Math.PI*2); ctx.fill();
}

  const vg = ctx.createRadialGradient(W/2,H/2,W*0.35,W/2,H/2,W*0.75);

}

  ctx.fillRect(0, 20, 5, 38);   // bordo sx
  ctx.fillRect(39, 20, 5, 38);  // bordo dx
  ctx.fillRect(0, 54, 44, 4);   // bordo basso

  // Bottoni
  ctx.fillStyle = '#1a2a5a';
  [28,34,40].forEach(y => {
    ctx.beginPath(); ctx.arc(22, y, 1.5, 0, Math.PI*2); ctx.fill();
  });

  // Colletto polo
  ctx.fillStyle = '#e8e8e8';
  ctx.beginPath();
  ctx.moveTo(14, 20); ctx.lineTo(22, 26); ctx.lineTo(30, 20);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#1a2a5a';
  ctx.beginPath();
  ctx.moveTo(16, 20); ctx.lineTo(22, 24); ctx.lineTo(28, 20);
  ctx.closePath(); ctx.fill();

  // ── Braccia ──
  const swing = zallyState;
  if (swing === 'backswing') {

    roundRect(ctx, 44, 28, 14, 10, 2);
    // mani
    ctx.fillStyle = '#f0c890'; roundRect(ctx, -14, 26, 10, 8, 2); roundRect(ctx, 44, 26, 10, 8, 2);
    // mazza — dietro (backswing)
    ctx.save(); ctx.translate(-8, 26); ctx.rotate(-1.3);
    ctx.strokeStyle='#888'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,54); ctx.stroke();

  } else if (swing === 'swing') {
    ctx.fillStyle = '#e8e8e8';

  // ── Cappello da golf ──

  // logo Z sul cappello
  ctx.fillStyle = s.color;

  // ── Occhi ──
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(16,-12,5.5,6,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(28,-12,5.5,6,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1a1a1a';

  ctx.beginPath(); ctx.ellipse(34,-6,5,3.5,0.2,0,Math.PI*2); ctx.fill();

  ctx.restore();
}

/* helper roundRect cross-browser */
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
  c.fill();
}

      animation:starFly 1.4s ${Math.random()*.5}s ease-out forwards;

  }
}

function ac() {
  try { return new (window.AudioContext||window.webkitAudioContext)(); } catch(e){return null;}
}
function playSwing() {
  const a = ac(); if(!a)return;
  const o = a.createOscillator(), g = a.createGain();
  o.connect(g); g.connect(a.destination);
  o.type='sawtooth'; o.frequency.setValueAtTime(320,a.currentTime);
  o.frequency.exponentialRampToValueAtTime(55,a.currentTime+0.22);
  g.gain.setValueAtTime(0.35,a.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.22);
  o.start(); o.stop(a.currentTime+0.22);
}
function playLand() {
  const a = ac(); if(!a)return;
  const buf=a.createBuffer(1,a.sampleRate*.1,a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(a.sampleRate*.028));
  const s=a.createBufferSource(); s.buffer=buf;
  const g=a.createGain(); g.gain.value=0.22;
  s.connect(g); g.connect(a.destination); s.start();
}

    o.type='square'; o.frequency.value=f;
    g.gain.setValueAtTime(0,a.currentTime+i*.12);
    g.gain.linearRampToValueAtTime(.14,a.currentTime+i*.12+.02);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+i*.12+.1);
    o.start(a.currentTime+i*.12); o.stop(a.currentTime+i*.12+.11);
  });
}
